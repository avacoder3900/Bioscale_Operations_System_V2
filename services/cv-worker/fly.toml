# Fly.io deploy config for the BIMS CV worker
# (FastAPI: PaDiM anomaly-detection training + ONNX inference).
#
# Deploy from THIS directory (services/cv-worker):
#   fly apps create bims-cv-worker          # once; pick a unique name if taken
#   fly secrets set R2_ACCOUNT_ID=... R2_ACCESS_KEY_ID=... R2_SECRET_ACCESS_KEY=... R2_BUCKET_NAME=brevitest-cv -a bims-cv-worker
#   fly deploy
#
# Then set CV_WORKER_URL=https://<app>.fly.dev in Vercel (Production) and redeploy main.
#
# NOTE: training state is in-memory and scratch is local /tmp, so this MUST be a
# single always-on machine — do not enable auto-stop or scale >1 while a train
# may be running, or in-flight progress is lost.

app = "bims-cv-worker"
primary_region = "dfw"   # Dallas — closest Fly region to Houston; change if you prefer

[build]
  dockerfile = "Dockerfile"

[env]
  TRAINING_DATA_DIR = "/tmp/cv-training"
  MODEL_INPUT_SIZE = "256"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false     # keep warm: in-memory training state + /tmp scratch
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

[[http_service.checks]]
  method = "get"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "40s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"            # bump to "8gb" if a train fails with an out-of-memory error
